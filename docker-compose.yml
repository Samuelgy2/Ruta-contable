# Desarrollo local. La base de datos es única y vive en Supabase: no hay servicio
# postgres aquí. Crea backend/.env a partir de backend/.env.example (DB_*, JWT_SECRET,
# BREVO_*, PAYPAL_*) antes de levantar los contenedores.
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: rutacontable_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT:                 3001
      NODE_ENV:             development
      TRUST_PROXY:          0  # sin proxy delante: no confiar en X-Forwarded-For
      CORS_ORIGIN:          http://localhost:3000
      FRONTEND_URL:         http://localhost:3000
      CHOKIDAR_USEPOLLING:  "true"
      WATCHPACK_POLLING:    "true"
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:3001:3001"
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: rutacontable_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL:        /api
      DOCKER:              "true"
      CI:                  "true"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING:   "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:5173"
    command: npm run dev
